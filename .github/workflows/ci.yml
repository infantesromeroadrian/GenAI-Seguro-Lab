name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (uv, locked)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Full history: evidence tests resolve pinned commits and trees with git.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.14"
          enable-cache: false

      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - name: Run the full test suite
        run: uv run --frozen python -m pytest -q
