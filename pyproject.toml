[project]
name = "genai-seguro-lab"
version = "0.1.0"
description = "Laboratorio local para diseñar, atacar, proteger y evaluar una aplicación GenAI con herramientas."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[tool.uv]
package = false

[tool.pytest]
minversion = "9.0"
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
pythonpath = ["src"]
testpaths = ["tests"]
